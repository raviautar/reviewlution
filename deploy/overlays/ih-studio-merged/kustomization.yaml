# The merged Studio preview (Feiyin's layout + the hub fixes) on the dev
# cluster: internal (VPN) ingress, its own data disk, Home as the start route.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ih-studio-merged
resources:
  - ../../base
images:
  - name: ghcr.io/raviautar/reviewlution
    newName: wandserviceplatform.azurecr.io/images/review-toolbar
    newTag: "105cfc7"
patches:
  - target:
      kind: PersistentVolumeClaim
      name: review-toolbar-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: managed-csi
  - target:
      kind: Deployment
      name: review-toolbar
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: UPSTREAM
            value: http://ih-studio-merged:8080
          - name: DATA_FILE
            value: /data/comments.json
          - name: DEFAULT_ROUTE
            value: /
          - name: APP_TITLE
            value: Studio merged preview · Review
  - target:
      kind: Ingress
      name: review-toolbar
    patch: |
      - op: add
        path: /spec/ingressClassName
        value: internal
      - op: add
        path: /metadata/annotations/kubernetes.io~1ingress.class
        value: internal
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname
        value: ih-studio-merged-review.dev.wand.ai
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1cloudflare-proxied
        value: "false"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1ttl
        value: "120"
      - op: replace
        path: /spec/rules/0/host
        value: ih-studio-merged-review.dev.wand.ai
      - op: replace
        path: /spec/tls/0/hosts/0
        value: ih-studio-merged-review.dev.wand.ai
      - op: replace
        path: /spec/tls/0/secretName
        value: ih-studio-merged-review.dev.wand.ai-tls
