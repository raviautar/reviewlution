apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: review-toolbar
  labels:
    app.kubernetes.io/name: review-toolbar
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: review.example.com
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: review-toolbar
                port:
                  number: 8090
  tls:
    - hosts:
        - review.example.com
      secretName: review.example.com-tls
